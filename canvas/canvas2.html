
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<canvas id="myCanvas" width="600" height="600" style="border:1px solid black;"></canvas>
<script>
let c = document.getElementById("myCanvas");
let ctx = c.getContext("2d");
ctx.beginPath();
ctx.arc(200, 300, 80, 0, 2 * Math.PI);
ctx.fillStyle = "yellow";
ctx.fill();

ctx.fillStyle = "blue";
ctx.fillRect(100, 300, 200, 150);

ctx.fillStyle = "red";
ctx.beginPath();
ctx.moveTo(80, 300);
ctx.lineTo(200, 200);
ctx.lineTo(320, 300);
ctx.closePath();
ctx.fill();

ctx.fillStyle = "lightgray";
ctx.fillRect(120, 370, 50, 80);

ctx.fillStyle = "lightgray";
ctx.fillRect(200, 330, 60, 40);
</script>
</body>
</html>
