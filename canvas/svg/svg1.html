<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <title>Brod - SVG</title>
  </head>
  <body>
    <svg
      width="520"
      height="500"
      viewBox="0 0 520 500"
      xmlns="http://www.w3.org/2000/svg"
    >
      <!-- Nebo -->
      <rect x="10" y="10" width="500" height="375" fill="lightblue" />

      <!-- More -->
      <rect x="10" y="385" width="500" height="105" fill="blue" />

      <!-- Sunce -->
      <circle cx="420" cy="105" r="55" fill="yellow" />

      <!-- Trup broda -->
      <rect x="102" y="362" width="208" height="50" fill="brown" />

      <!-- Jedro -->
      <polygon points="212,215 125,350 285,350" fill="white" />

      <!-- Jarbol -->
      <rect x="200" y="143" width="13" height="220" fill="black" />

      <!-- Zastavica -->
      <polygon points="200,155 150,174 200,192" fill="green" />

      <!-- Vanjski okvir slike -->
      <rect
        x="10"
        y="10"
        width="500"
        height="480"
        fill="none"
        stroke="black"
        stroke-width="6"
      />
    </svg>
  </body>
</html>
