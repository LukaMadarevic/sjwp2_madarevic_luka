<!doctype html>

  <body>
    <svg
      width="600"
      height="600"
      viewBox="0 0 600 600"
      xmlns="http://www.w3.org/2000/svg"
    >
      <!-- glava -->
      <circle cx="300" cy="190" r="75" fill="#cf8737" />

      <!-- ruke -->
      <rect x="150" y="230" width="300" height="90" rx="45" fill="#cf8737" />

      <!-- noge -->
      <polygon
        points="250,300 190,490 250,500 300,340 350,500 410,490 350,300"
        fill="#cf8737"
      />

      <!-- oči -->
      <circle cx="275" cy="180" r="10" fill="white" />
      <circle cx="325" cy="180" r="10" fill="white" />

      <!-- usta -->
      <rect x="270" y="215" width="60" height="15" rx="7" fill="white" />

      <!-- gumbi -->
      <circle cx="300" cy="275" r="12" fill="black" />
      <circle cx="300" cy="315" r="12" fill="black" />
    </svg>
  </body>
